<h1>工作流画布</h1>
<p>这是插件的本地服务入口。请在 DeepSeek Harness 左侧打开“画布”，从项目总览创建项目、选择模板并查看成果。</p>
<p>完整界面运行在 Harness 内，使用你的宿主账号。这里不会显示演示进度、私人项目或自动启动执行。</p>
<p><a href="/api/health">查看本地服务版本</a> · 安装与使用说明见发行包 <code>docs/安装与快速开始.md</code>。</p>
