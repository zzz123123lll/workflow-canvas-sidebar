name: Bug report
description: Installation, workflow, revision or delivery problem
body:
  - type: input
    id: versions
    attributes:
      label: Plugin version/build, OS and Harness version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Optional redacted diagnostics
      description: Do not include tokens, accounts or private conversations.
